<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sam Sparking — Präsentation</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#070a13">
  <meta name="description" content="Vorführ-Fassung: Website und Verwaltung nebeneinander, mit direktem Anpassungswunsch aus der Seite heraus.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23070a13'/%3E%3Cpath d='M36 6 14 38h14l-4 20 26-34H34z' fill='%233b7bff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="praesentation/shell.css">
</head>
<body>

<header class="leiste">
  <div class="marke">
    <span class="funke">◆</span>
    <span class="marke-text">Sam Sparking</span>
    <span class="marke-zusatz">Präsentation</span>
  </div>

  <!-- Umschalter zwischen den beiden Ansichten -->
  <div class="umschalter" role="tablist" aria-label="Ansicht">
    <button class="um-knopf an" type="button" role="tab" aria-selected="true" data-ansicht="website">Website</button>
    <button class="um-knopf" type="button" role="tab" aria-selected="false" data-ansicht="verwaltung">Verwaltung</button>
  </div>

  <!-- Nur für die Website: Sprache und Gerät -->
  <div class="werkzeuge" data-nur="website">
    <label class="feld">
      <span class="sr-only">Sprache</span>
      <select id="sprache">
        <option value="">English</option>
        <option value="de">Deutsch</option>
        <option value="fr">Français</option>
      </select>
    </label>
    <button class="knopf leise" type="button" id="geraet" aria-pressed="false">Handy-Ansicht</button>
  </div>

  <div class="werkzeuge rechts">
    <button class="knopf leise" type="button" id="neu-laden" title="Ansicht neu laden">Neu laden</button>
    <button class="knopf wunsch" type="button" id="wunsch-schalter" aria-pressed="false">
      Anpassungswunsch
    </button>
    <button class="knopf leise nur-schmal" type="button" id="leiste-auf" aria-expanded="false">
      Änderungen <span class="zahl-chip" id="zahl-chip">0</span>
    </button>
  </div>
</header>

<!-- Hinweisband, sichtbar solange der Wunsch-Modus läuft -->
<div class="band" id="band" hidden>
  <span class="band-punkt"></span>
  <span class="band-text">Auf die Stelle tippen, die geändert werden soll — <strong>alles</strong> ist wählbar.</span>
  <div class="genauigkeit" role="group" aria-label="Genauigkeit">
    <button class="gen-knopf an" type="button" data-genauigkeit="element">Element</button>
    <button class="gen-knopf" type="button" data-genauigkeit="wort">Einzelnes Wort</button>
  </div>
  <span class="band-ziel" id="band-ziel"></span>
</div>

<div class="werk">
  <main class="buehne" id="buehne">
    <div class="rahmen" id="rahmen-website">
      <iframe id="frame-website" src="site/" title="Website Sam Sparking"></iframe>
    </div>
    <div class="rahmen" id="rahmen-verwaltung" hidden>
      <iframe id="frame-verwaltung" src="verwaltung/" title="Verwaltung Sam Sparking"></iframe>
    </div>
  </main>

  <!-- Seitenleiste: alle Änderungswünsche dieser Sitzung -->
  <aside class="seitenleiste" id="seitenleiste" aria-label="Änderungen">
    <div class="sl-kopf">
      <div class="sl-titel">
        <strong>Änderungen</strong>
        <span class="zahl-chip" id="sl-zahl">0</span>
      </div>
      <button class="knopf leise sm nur-schmal" type="button" id="leiste-zu" aria-label="Seitenleiste schliessen">✕</button>
    </div>

    <div class="sl-filter" role="group" aria-label="Filter">
      <button class="fil-knopf an" type="button" data-filter="alle">Alle</button>
      <button class="fil-knopf" type="button" data-filter="Website">Website</button>
      <button class="fil-knopf" type="button" data-filter="Verwaltung">Verwaltung</button>
    </div>

    <div class="sl-inhalt" id="sl-inhalt"></div>

    <div class="sl-fuss">
      <div class="sl-fuss-zeile">
        <span class="sl-punkt ok"></span>
        <span id="sl-bilanz">Noch nichts abgeschickt</span>
      </div>
      <p class="sl-hinweis">
        Jede Änderung wird eine Aufgabe im Projekt <code id="sl-projekt">PRJ-YWRM4</code> in Quantus.
      </p>
    </div>
  </aside>
</div>

<noscript>
  <p style="padding:40px;font-family:sans-serif;color:#fff">Diese Präsentation braucht JavaScript.</p>
</noscript>

<script type="module" src="praesentation/shell.js"></script>
</body>
</html>
